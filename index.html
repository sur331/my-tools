<!-- بداية أداة اختصار الروابط ببايثون -->
<div class="tool-card" style="background: var(--card-bg, white); border: 1px solid var(--border, #ccc); border-radius: 12px; padding: 25px; max-width: 500px; margin: 30px auto; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); direction: rtl; font-family: Arial, sans-serif;">
    <h3 style="color: var(--primary, #6366f1); margin-top: 0; font-size: 20px;">مختصر الروابط الذكي (Python)</h3>
    <p style="color: var(--text, #333); font-size: 14px; margin-bottom: 15px;">أدخل الرابط الطويل ليتم معالجته بواسطة كود بايثون:</p>
    
    <input type="url" id="python_url_input" placeholder="https://example.com" style="width: 90%; padding: 12px; margin: 10px 0; border: 1px solid var(--border, #ccc); border-radius: 6px; text-align: left; direction: ltr; font-size: 16px;">
    
    <button id="python_shorten_btn" style="background: var(--primary, #6366f1); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 95%;">تقصير باستخدام Python</button>
    
    <div id="python_result_box" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border, #ccc);">
        <p style="margin: 5px 0; color: var(--text, #333);"><strong>الرابط القصير الخاص بك:</strong></p>
        <input type="text" id="python_url_output" readonly style="width: 90%; padding: 10px; background: rgba(0,0,0,0.02); border: 1px solid var(--primary, #6366f1); border-radius: 6px; text-align: left; direction: ltr; font-size: 16px; color: var(--primary, #6366f1); font-weight: bold;" onclick="this.select()">
        <button onclick="jsCopyLink()" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 95%; margin-top: 8px; font-weight: bold;">نسخ الرابط</button>
    </div>
</div>

<!-- تحميل بيئة بايثون للويب وتأمين تشغيلها داخلياً -->
<link rel="stylesheet" href="https://pyscript.net">
<script type="module" src="https://pyscript.net"></script>

<script type="py">
from pyscript import document
import pyodide.http

async def run_shortener(event):
    url_input = document.querySelector("#python_url_input")
    url_output = document.querySelector("#python_url_output")
    result_box = document.querySelector("#python_result_box")
    
    long_url = url_input.value.strip()
    
    if not long_url:
        document.window.alert("الرجاء إدخال رابط أولاً!")
        return
        
    url_output.value = "جاري المعالجة ببايثون..."
    result_box.style.display = "block"
    
    api_url = f"https://tinyurl.com{long_url}"
    
    try:
        response = await pyodide.http.pyfetch(api_url, method="GET")
        if response.status == 200:
            short_url = await response.string()
            url_output.value = short_url
        else:
            url_output.value = "خطأ في استجابة الخادم"
    except Exception as e:
        url_output.value = "فشل الاتصال البرمجي"

document.querySelector("#python_shorten_btn").onclick = run_shortener
</script>

<script>
function jsCopyLink() {
  var copyText = document.getElementById("python_url_output");
  if(copyText.value && !copyText.value.includes("جاري")) {
    copyText.select();
    copyText.setSelectionRange(0, 99999); // مخصص لمتصفحات الهواتف الذكية
    navigator.clipboard.writeText(copyText.value);
    alert("تم نسخ الرابط القصير بنجاح!");
  }
}
</script>
<!-- نهاية أداة بايثون المتكاملة -->
