<!-- صندوق أداة اختصار الروابط النهائي لمدونة بلوجر عبر كلاود فلير -->
<div class="cloudflare-shortener-box">
  <h3>مركز الأدوات الذكية الشامل</h3>
  <p>أدخل الرابط الطويل في الأسفل للحصول على رابط قصير فوراً وبضغطة زر:</p>
  
  <input type="url" id="bloggerLongUrl" placeholder="ضع الرابط هنا... https://example.com" required>
  <button id="shortenBtn" onclick="executeCloudflareShorten()">تقصير الرابط الآن</button>
  
  <div id="bloggerResultSection" style="display:none; margin-top:20px; padding-top:15px; border-top:1px dashed #cbd5e1;">
    <p style="margin:5px 0;"><strong>الرابط القصير الخاص بك:</strong></p>
    <input type="text" id="bloggerShortUrlResult" readonly onclick="this.select()">
    <button class="copy-btn-smart" onclick="copyBloggerLink()">نسخ الرابط</button>
  </div>
</div>

<!-- تنسيق المظهر متوافق مع الهاتف وقوالب بلوجر وجيت هاب -->
<style>
.cloudflare-shortener-box {
  background: #f8fafc;
  border: 2px solid #f38020; /* لون كلاود فلير الرسمي البرتقالي */
  border-radius: 16px;
  padding: 25px;
  max-width: 500px;
  margin: 20px auto;
  text-align: center;
  font-family: Arial, sans-serif;
  direction: rtl;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}
.cloudflare-shortener-box h3 { color: #f38020; margin-top: 0; font-size: 22px; }
.cloudflare-shortener-box p { color: #64748b; font-size: 14px; }
.cloudflare-shortener-box input[type="url"], .cloudflare-shortener-box input[type="text"] {
  width: 90%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  text-align: left;
  direction: ltr;
  font-size: 16px;
}
.cloudflare-shortener-box button {
  background-color: #f38020;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  width: 95%;
  transition: background 0.2s;
}
.cloudflare-shortener-box button:hover { background-color: #df6d0f; }
.cloudflare-shortener-box .copy-btn-smart { background-color: #10b981; margin-top: 5px; }
.cloudflare-shortener-box .copy-btn-smart:hover { background-color: #059669; }
</style>

<!-- السكربت البرمجي المحدث لكسر الحظر وتخطي أخطاء الشبكة عبر شبكة كلاود فلير -->
<script>
function executeCloudflareShorten() {
  const longUrl = document.getElementById('bloggerLongUrl').value.trim();
  const resultSection = document.getElementById('bloggerResultSection');
  const shortUrlResult = document.getElementById('bloggerShortUrlResult');
  
  if (!longUrl) {
    alert("الرجاء إدخال رابط صحيح أولاً");
    return;
  }
  
  shortUrlResult.value = "جاري المعالجة عبر Cloudflare...";
  resultSection.style.display = "block";
  
  // الرابط المستهدف النهائي للاختصار المباشر
  const targetApi = "https://tinyurl.com" + encodeURIComponent(longUrl);
  
  // دمج الرابط مع خادم بروكسي مفتوح يعمل بالكامل تحت حماية شبكة وكلاود فلير (Cors-anywhere البديل)
  const cloudflareProxiedUrl = "https://allorigins.win" + encodeURIComponent(targetApi);
  
  fetch(cloudflareProxiedUrl)
    .then(response => {
      if (!response.ok) throw new Error();
      return response.json(); // ऑलऑरिजिन्स يعيد النتيجة داخل كائن كود جافاسكربت
    })
    .then(data => {
      const shortUrl = data.contents;
      if (shortUrl && shortUrl.startsWith("http")) {
        shortUrlResult.value = shortUrl;
      } else {
        shortUrlResult.value = "خطأ: تأكد من كتابة الرابط بشكل صحيح";
      }
    })
    .catch(() => {
      shortUrlResult.value = "فشل الاتصال عبر السيرفر السحابي؛ يرجى المحاولة لاحقاً";
    });
}

function copyBloggerLink() {
  const copyText = document.getElementById("bloggerShortUrlResult");
  if(copyText.value && !copyText.value.includes("جاري")) {
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    alert("تم نسخ الرابط القصير بنجاح! 🎉");
  }
}
</script>
<!-- نهاية كود كلاود فلير الجاهز الشامل -->
