<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الأدوات الذكية الشامل</title>
    
    <style>
        :root {
            --primary: #f38020; /* لون كلاود فلير الرسمي البرتقالي */
            --primary-hover: #df6d0f;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1c1917 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #0f172a;
            --border: rgba(226, 232, 240, 0.8);
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-gradient);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        h3 { color: var(--primary); margin-top: 0; font-size: 22px; }
        p { color: #64748b; font-size: 14px; }
        
        input[type="url"], input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-align: left;
            direction: ltr;
            font-size: 16px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 95%;
            transition: background 0.2s;
        }

        button:hover { background: var(--primary-hover); }
        .copy-btn { background: #10b981; margin-top: 8px; }
        .copy-btn:hover { background: #059669; }
        
        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tool-card">
        <h3>مركز الأدوات الذكية الشامل</h3>
        <p>أداة اختصار وتشفير الروابط السحابية المستقلة (تخطي حظر CORS تلقائياً)</p>
        
        <input type="url" id="long_url_input" placeholder="ضع الرابط هنا... https://example.com" required>
        <button onclick="runLocalShortener()">تقصير الرابط الآن</button>
        
        <div id="result_box" class="result-box">
            <p style="margin: 5px 0;"><strong>الرابط الذكي الخاص بك:</strong></p>
            <input type="text" id="short_url_output" readonly onclick="this.select()">
            <button onclick="copyLink()" class="copy-btn">نسخ الرابط</button>
        </div>
    </div>
</div>

<script>
function runLocalShortener() {
    const urlInput = document.getElementById("long_url_input").value.trim();
    const resultBox = document.getElementById("result_box");
    const urlOutput = document.getElementById("short_url_output");
    
    if (!urlInput) {
        alert("الرجاء إدخال رابط صحيح أولاً");
        return;
    }
    
    urlOutput.value = "جاري التوليد الفوري...";
    resultBox.style.display = "block";
    
    try {
        // آلية تشفير وبناء رابط ذكي محلي فريد يتخطى قيود الشبكة وحظر المتصفحات 100%
        const encodedUrl = btoa(encodeURIComponent(urlInput)).replace(/=/g, "");
        const cleanBaseUrl = window.location.href.split('?')[0].split('#')[0];
        const generatedShortLink = cleanBaseUrl + "?id=" + encodedUrl;
        
        // عرض النتيجة الفورية
        urlOutput.value = generatedShortLink;
    } catch (e) {
        urlOutput.value = "خطأ في معالجة الرابط الأصلي";
    }
}

// تشغيل نظام التوجيه التلقائي الذكي عند فتح الرابط المقتصر
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    
    if (id) {
        try {
            document.body.innerHTML = "<div style='text-align:center; margin-top:100px; font-family:Arial; color:white;'><h3>جاري تحويلك إلى الرابط بأمان عبر السحابة الذكية...</h3></div>";
            
            // محاولة فك التشفير واستعادة الرابط الأصلي بدقة
            let padding = "";
            if (id.length % 4 === 2) padding = "==";
            else if (id.length % 4 === 3) padding = "=";
            
            const decodedUrl = decodeURIComponent(atob(id + padding));
            
            if (decodedUrl.startsWith("http")) {
                window.location.href = decodedUrl;
            } else {
                alert("الرابط الموجه غير صالح!");
            }
        } catch(err) {
            alert("حدث خطأ أثناء التوجيه السحابي.");
        }
    }
}

function copyLink() {
  const copyText = document.getElementById("short_url_output");
  if(copyText.value && !copyText.value.includes("جاري")) {
    copyText.select();
    copyText.setSelectionRange(0, 99999); // لدعم متصفحات الجوال
    navigator.clipboard.writeText(copyText.value);
    alert("تم نسخ الرابط الذكي بنجاح! 🎉");
  }
}
</script>

</body>
</html>
