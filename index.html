<!-- صندوق أداة اختصار الروابط الذكي والمقاوم للحظر الشامل -->
<div class="ultimate-shortener-box">
  <h3>مركز الأدوات الذكية الشامل</h3>
  <p>أدخل الرابط الطويل في الأسفل للحصول على رابط قصير فوراً وبضغطة زر:</p>
  
  <input type="url" id="userLongUrl" placeholder="ضع الرابط هنا... https://example.com" required>
  <button id="shortenActionBtn" onclick="startInstantShorten()">تقصير الرابط الآن</button>
  
  <div id="successResultSection" style="display:none; margin-top:20px; padding-top:15px; border-top:1px dashed #cbd5e1;">
    <p style="margin:5px 0;"><strong>الرابط القصير الخاص بك:</strong></p>
    <input type="text" id="finalShortUrlResult" readonly onclick="this.select()">
    <button class="copy-btn-fluent" onclick="copyFinalLink()">نسخ الرابط</button>
  </div>
</div>

<!-- تنسيق مظهر احترافي متوافق بالكامل مع شاشات الهواتف وقوالب الويب -->
<style>
.ultimate-shortener-box {
  background: #f8fafc;
  border: 2px solid #6366f1;
  border-radius: 16px;
  padding: 25px;
  max-width: 500px;
  margin: 20px auto;
  text-align: center;
  font-family: Arial, sans-serif;
  direction: rtl;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}
.ultimate-shortener-box h3 { color: #6366f1; margin-top: 0; font-size: 22px; }
.ultimate-shortener-box p { color: #64748b; font-size: 14px; }
.ultimate-shortener-box input[type="url"], .ultimate-shortener-box input[type="text"] {
  width: 90%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  text-align: left;
  direction: ltr;
  font-size: 16px;
}
.ultimate-shortener-box button {
  background-color: #6366f1;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  width: 95%;
  transition: background 0.2s;
}
.ultimate-shortener-box button:hover { background-color: #4f46e5; }
.ultimate-shortener-box .copy-btn-fluent { background-color: #10b981; margin-top: 5px; }
.ultimate-shortener-box .copy-btn-fluent:hover { background-color: #059669; }
</style>

<!-- السكربت البرمجي الذكي المقاوم للحظر وحظر الأمان تماماً -->
<script>
function startInstantShorten() {
  const longUrlInput = document.getElementById('userLongUrl').value.trim();
  const resultSection = document.getElementById('successResultSection');
  const shortUrlOutput = document.getElementById('finalShortUrlResult');
  
  if (!longUrlInput) {
    alert("الرجاء إدخال رابط صحيح أولاً");
    return;
  }
  
  shortUrlOutput.value = "جاري توليد الرابط وتخطي الحظر...";
  resultSection.style.display = "block";
  
  // دمج الخدمة المباشرة المفتوحة عبر بروتوكول تحويل العناوين المباشر والمضمون (v.gd)
  const apiUrl = "https://v.gd" + encodeURIComponent(longUrlInput) + "&callback=processGlobalResponse";
  
  // كسر حظر CORS عن طريق ضخ الطلب كعنصر script مستقل ومتوافق مع المتصفحات
  const scriptElement = document.createElement('script');
  scriptElement.src = apiUrl;
  scriptElement.id = "jsonp_temp_script";
  
  // تنظيف أي محاولات سابقة معلقة لضمان الاستجابة الفورية
  const oldScript = document.getElementById("jsonp_temp_script");
  if(oldScript) { oldScript.remove(); }
  
  document.body.appendChild(scriptElement);
}

// استقبال النتيجة وعرض الرابط القصير جداً فوراً
function processGlobalResponse(data) {
  const shortUrlOutput = document.getElementById('finalShortUrlResult');
  if (data && data.shorturl) {
    shortUrlOutput.value = data.shorturl; // سيظهر الرابط قصيراً جداً ومباشراً
  } else if (data && data.errormessage) {
    shortUrlOutput.value = "خطأ من الخادم: " + data.errormessage;
  } else {
    shortUrlOutput.value = "خطأ: تأكد من كتابة الرابط بشكل صحيح مثل https://google.com";
  }
}

// دالة النسخ بضغطة زر واحدة من الجوال
function copyFinalLink() {
  const outputField = document.getElementById("finalShortUrlResult");
  if(outputField.value && !outputField.value.includes("جاري")) {
    outputField.select();
    outputField.setSelectionRange(0, 99999); // توافق كامل مع متصفحات آيفون وأندرويد
    navigator.clipboard.writeText(outputField.value);
    alert("تم نسخ الرابط القصير بنجاح! 🎉");
  }
}
</script>
<!-- نهاية الكود الجاهز -->
