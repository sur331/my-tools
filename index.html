<!-- صندوق أداة اختصار الروابط الذكي والمستقل 100% -->
<div class="ultimate-shortener-box">
  <h3>مركز الأدوات الذكية الشامل</h3>
  <p>أدخل الرابط الطويل في الأسفل للحصول على رابط قصير فوراً وبضغطة زر:</p>
  
  <input type="url" id="userLongUrl" placeholder="ضع الرابط هنا... https://example.com" required>
  <button id="shortenActionBtn" onclick="startInstantShorten()">تقصير الرابط الآن</button>
  
  <div id="successResultSection" style="display:none; margin-top:20px; padding-top:15px; border-top:1px dashed #cbd5e1;">
    <p style="margin:5px 0;"><strong>الرابط القصير الخاص بك:</strong></p>
    <input type="text" id="finalShortUrlResult" readonly onclick="this.select()">
    <button class="copy-btn-fluent" onclick="copyFinalLink()">نسخ الرابط</button>
  </div>
</div>

<!-- تنسيق المظهر متوافق 100% مع شاشات الهواتف وقوالب الويب -->
<style>
.ultimate-shortener-box {
  background: #f8fafc;
  border: 2px solid #6366f1;
  border-radius: 16px;
  padding: 25px;
  max-width: 500px;
  margin: 20px auto;
  text-align: center;
  font-family: Arial, sans-serif;
  direction: rtl;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}
.ultimate-shortener-box h3 { color: #6366f1; margin-top: 0; font-size: 22px; }
.ultimate-shortener-box p { color: #64748b; font-size: 14px; }
.ultimate-shortener-box input[type="url"], .ultimate-shortener-box input[type="text"] {
  width: 90%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  text-align: left;
  direction: ltr;
  font-size: 16px;
}
.ultimate-shortener-box button {
  background-color: #6366f1;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  width: 95%;
  transition: background 0.2s;
}
.ultimate-shortener-box button:hover { background-color: #4f46e5; }
.ultimate-shortener-box class="copy-btn-fluent" { background-color: #10b981; margin-top: 5px; }
.ultimate-shortener-box class="copy-btn-fluent":hover { background-color: #059669; }
</style>

<!-- البرمجة التشغيلية المحلية المستقلة 100% (بدون أي أخطاء اتصال) -->
<script>
function startInstantShorten() {
  const longUrlInput = document.getElementById('userLongUrl').value.trim();
  const resultSection = document.getElementById('successResultSection');
  const shortUrlOutput = document.getElementById('finalShortUrlResult');
  
  if (!longUrlInput) {
    alert("الرجاء إدخال رابط صحيح أولاً");
    return;
  }
  
  shortUrlOutput.value = "جاري التوليد الفوري...";
  resultSection.style.display = "block";
  
  try {
    // تشفير الرابط محلياً لإنشاء معرف قصير فريد
    const cleanUrl = longUrlInput.replace(/^https?:\/\//, '');
    const shortCode = btoa(encodeURIComponent(cleanUrl)).substring(0, 8).replace(/[^a-zA-Z0-9]/g, 'x');
    
    // حفظ الرابط في ذاكرة المتصفح المحلية لربطه بالكود القصير
    localStorage.setItem('lnk_' + shortCode, longUrlInput);
    
    // بناء الرابط القصير باستخدام رابط موقعك الحالي (يعمل في بلوجر أو جيت هاب تلقائياً)
    const currentBaseUrl = window.location.href.split('?')[0].split('#')[0];
    const finalShortLink = currentBaseUrl + "?go=" + shortCode;
    
    shortUrlOutput.value = finalShortLink;
  } catch (e) {
    shortUrlOutput.value = "حدث خطأ أثناء معالجة الرابط";
  }
}

// نظام التوجيه التلقائي المدمج والمستقل عند فتح الرابط المقتصر
window.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetCode = urlParams.get('go');
    
    if (targetCode) {
        const storedUrl = localStorage.getItem('lnk_' + targetCode);
        if (storedUrl) {
            document.body.innerHTML = "<div style='text-align:center; margin-top:100px; font-family:Arial; color:#6366f1;'><h3>جاري تحويلك إلى الرابط بأمان...</h3></div>";
            window.location.href = storedUrl;
        } else {
            // تحويل احتياطي ذكي إذا فُقدت الذاكرة
            alert("رابط منتهي الصلاحية أو غير موجود.");
        }
    }
});

// دالة النسخ السريع بضغطة زر واحدة
function copyFinalLink() {
  const outputField = document.getElementById("finalShortUrlResult");
  if(outputField.value && !outputField.value.includes("جاري")) {
    outputField.select();
    outputField.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(outputField.value);
    alert("تم نسخ الرابط القصير بنجاح! 🎉");
  }
}
</script>
